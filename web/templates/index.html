<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>壁纸管理 (Wallpaper Manager)</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #00bcd4;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            padding: 20px;
        }

        .card {
            background-color: #1e1e1e;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            transition: transform 0.2s;
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            cursor: pointer;
        }

        .card-body {
            padding: 10px;
            text-align: center;
        }

        .card-title {
            font-size: 0.9em;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        #modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        #modal img {
            max-width: 90%;
            max-height: 90%;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
        }

        .close {
            position: absolute;
            top: 20px;
            right: 30px;
            color: #fff;
            font-size: 40px;
            cursor: pointer;
        }

        .header-actions {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
        }

        .action-btn {
            background-color: #00bcd4;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }

        .action-btn:hover {
            background-color: #0097a7;
        }

        .download-btn {
            background-color: #4caf50;
        }

        .download-btn:hover {
            background-color: #388e3c;
        }

        #settings-modal {
            display: none;
            position: fixed;
            z-index: 1001;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0, 0, 0, 0.6);
        }

        .modal-content {
            background-color: #1e1e1e;
            margin: 10% auto;
            padding: 20px;
            border: 1px solid #333;
            width: 400px;
            max-width: 90%;
            border-radius: 8px;
            color: #fff;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        .close-settings {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }

        .close-settings:hover,
        .close-settings:focus {
            color: #fff;
            text-decoration: none;
            cursor: pointer;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #ddd;
        }

        .form-group input[type="text"] {
            width: 100%;
            padding: 8px;
            border: 1px solid #444;
            border-radius: 4px;
            background-color: #333;
            color: #fff;
            box-sizing: border-box;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
        }

        .checkbox-group input {
            margin-right: 10px;
        }

        button[type="button"] {
            background-color: #00bcd4;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
            margin-top: 10px;
        }

        button[type="button"]:hover {
            background-color: #0097a7;
        }

        #file-browser-modal {
            display: none;
            position: fixed;
            z-index: 1002;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0, 0, 0, 0.7);
        }

        /* File Browser Styles */
        .file-browser-content {
            background-color: #1e1e1e;
            margin: 5% auto;
            padding: 20px;
            border: 1px solid #333;
            width: 600px;
            max-width: 90%;
            border-radius: 8px;
            color: #fff;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            height: 70vh;
            display: flex;
            flex-direction: column;
        }

        .file-list {
            flex: 1;
            overflow-y: auto;
            border: 1px solid #444;
            margin: 10px 0;
            padding: 10px;
            background: #252525;
        }

        .file-item {
            padding: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            border-bottom: 1px solid #333;
        }

        .file-item:hover {
            background-color: #333;
        }

        .file-item.selected {
            background-color: #00bcd4;
            color: #fff;
        }

        .file-icon {
            margin-right: 10px;
        }

        .browser-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .current-path {
            flex: 1;
            background: #333;
            padding: 5px 10px;
            margin: 0 10px;
            border-radius: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
    </style>
</head>

<body>
    <h1>壁纸画廊</h1>
    <div class="header-actions">
        <button class="action-btn download-btn" onclick="downloadNow()">⬇ 立即下载</button>
        <button class="action-btn settings-btn" onclick="openSettings()">⚙ 设置</button>
    </div>
    <div class="gallery" id="gallery">
        <!-- Images will be loaded here -->
    </div>

    <!-- Image Preview Modal -->
    <div id="modal" onclick="closeModal()">
        <span class="close">&times;</span>
        <img id="modal-img" src="">
    </div>

    <!-- Settings Modal -->
    <div id="settings-modal" class="modal">
        <div class="modal-content">
            <span class="close-settings" onclick="closeSettings()">&times;</span>
            <h2>设置</h2>
            <form id="settings-form">
                <div class="form-group">
                    <label for="download-path">下载路径:</label>
                    <div style="display: flex; gap: 10px;">
                        <input type="text" id="download-path" name="path" style="flex: 1;">
                        <button type="button" onclick="openFileBrowser()"
                            style="width: auto; margin-top: 0;">选择文件夹</button>
                    </div>
                </div>
                <div class="form-group">
                    <label>Bing 壁纸:</label>
                    <div class="checkbox-group">
                        <input type="checkbox" id="bing-enabled" name="bing-enabled">
                        <label for="bing-enabled">启用下载</label>
                    </div>
                </div>
                <div class="form-group">
                    <label for="bing-schedule">定时任务 (Cron):</label>
                    <input type="text" id="bing-schedule" name="bing-schedule">
                </div>
                <div style="display: flex; gap: 10px; margin-top: 20px;">
                    <button type="button" onclick="saveSettings()" style="width: 100%;">保存配置</button>
                </div>
            </form>
            </form>
        </div>
    </div>

    <!-- File Browser Modal -->
    <div id="file-browser-modal" class="modal">
        <div class="file-browser-content">
            <span class="close-settings" onclick="closeFileBrowser()">&times;</span>
            <h2>选择文件夹</h2>
            <div class="browser-controls">
                <button type="button" onclick="loadFileList(currentParentPath)"
                    style="width: auto; padding: 5px 15px;">⬆ 上一级</button>
                <div class="current-path" id="browser-current-path"></div>
            </div>
            <div id="browser-shortcuts" style="margin-bottom: 10px; display: flex;">
                <!-- Shortcuts loaded via JS -->
            </div>
            <div class="file-list" id="file-list">
                <!-- File items here -->
            </div>
            <div style="text-align: right; margin-top: 10px;">
                <button type="button" onclick="confirmSelection()" style="width: auto;">确认选择</button>
                <button type="button" onclick="closeFileBrowser()"
                    style="width: auto; background-color: #666;">取消</button>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            fetchImages();
        });

        function fetchImages() {
            fetch('/api/images')
                .then(response => response.json())
                .then(images => {
                    const gallery = document.getElementById('gallery');
                    gallery.innerHTML = '';
                    if (!images || images.length === 0) {
                        gallery.innerHTML = '<p style="text-align:center;width:100%">暂无图片</p>';
                        return;
                    }
                    images.forEach(src => {
                        const card = document.createElement('div');
                        card.className = 'card';

                        const filename = src.split('/').pop();

                        card.innerHTML = `
                            <img src="${src}" alt="${filename}" loading="lazy" onclick="openModal('${src}')">
                            <div class="card-body">
                                <div class="card-title" title="${filename}">${filename}</div>
                            </div>
                        `;
                        gallery.appendChild(card);
                    });
                })
                .catch(err => console.error('Error fetching images:', err));
        }

        function openModal(src) {
            const modal = document.getElementById('modal');
            const img = document.getElementById('modal-img');
            img.src = src;
            modal.style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('modal').style.display = 'none';
        }

        // Settings Logic
        function openSettings() {
            fetch('/api/config')
                .then(response => response.json())
                .then(config => {
                    document.getElementById('download-path').value = config.download.path;
                    document.getElementById('bing-enabled').checked = config.download.bing.enabled;
                    document.getElementById('bing-schedule').value = config.download.bing.schedule;
                    document.getElementById('settings-modal').style.display = 'block';
                })
                .catch(err => alert('加载配置失败: ' + err));
        }

        function closeSettings() {
            document.getElementById('settings-modal').style.display = 'none';
        }

        function saveSettings() {
            const config = {
                server: { port: 8080 }, // Preserve existing port or fetch if needed, currently hardcoded assumption or partial update
                download: {
                    path: document.getElementById('download-path').value,
                    bing: {
                        enabled: document.getElementById('bing-enabled').checked,
                        schedule: document.getElementById('bing-schedule').value
                    }
                }
            };

            // Re-fetch current config to merge server config properly if missed
            fetch('/api/config')
                .then(res => res.json())
                .then(currentConfig => {
                    config.server = currentConfig.server; // Keep server config intact

                    fetch('/api/config', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(config)
                    })
                        .then(response => {
                            if (response.ok) {
                                alert('配置已保存 (可能需要重启生效)');
                                closeSettings();
                                fetchImages(); // Refresh in case path changed
                            } else {
                                alert('保存失败');
                            }
                        })
                        .catch(err => alert('保存错误: ' + err));
                });
        }

        function downloadNow() {
            if (!confirm('确定要立即开始下载壁纸吗？这可能需要一些时间。')) {
                return;
            }

            // Show loading state or disable button
            const btn = event.target;
            const originalText = btn.innerText;
            btn.innerText = "下载中...";
            btn.disabled = true;

            fetch('/api/download', { method: 'POST' })
                .then(response => {
                    if (response.ok) {
                        alert('下载完成');
                        fetchImages(); // Refresh gallery
                    } else {
                        alert('下载失败');
                    }
                })
                .catch(err => alert('请求错误: ' + err))
                .finally(() => {
                    btn.innerText = originalText;
                    btn.disabled = false;
                });
        }

        let currentBrowserPath = '';
        let currentParentPath = '';

        function openFileBrowser() {
            document.getElementById('file-browser-modal').style.display = 'block';
            // Start listing from current config path or root
            const initialPath = document.getElementById('download-path').value || '';
            loadFileList(initialPath);
            loadShortcuts();
        }

        function loadShortcuts() {
            fetch('/api/fs/shortcuts')
                .then(res => res.json())
                .then(data => {
                    const container = document.getElementById('browser-shortcuts');
                    container.innerHTML = ''; // Clear existing

                    // Helper to add button
                    const addBtn = (name, path) => {
                        const btn = document.createElement('button');
                        btn.type = 'button';
                        btn.innerText = name;
                        btn.style.marginRight = '5px';
                        btn.style.padding = '5px 10px';
                        btn.onclick = () => loadFileList(path);
                        container.appendChild(btn);
                    };

                    addBtn('🏠 根目录', data.root);
                    addBtn('🖥️ 桌面', data.desktop);
                    addBtn('👤 用户首页', data.home);
                })
                .catch(err => console.error('Error loading shortcuts:', err));
        }

        function closeFileBrowser() {
            document.getElementById('file-browser-modal').style.display = 'none';
        }

        function loadFileList(path) {
            const url = path ? `/api/fs/list?path=${encodeURIComponent(path)}` : '/api/fs/list';

            fetch(url)
                .then(res => res.json())
                .then(data => {
                    const list = document.getElementById('file-list');
                    list.innerHTML = '';

                    currentBrowserPath = data.current;
                    currentParentPath = data.parent;
                    document.getElementById('browser-current-path').innerText = data.current;

                    if (!data.items || data.items.length === 0) {
                        list.innerHTML = '<div style="padding:10px;color:#aaa;">(空文件夹)</div>';
                        return;
                    }

                    data.items.forEach(item => {
                        if (!item.isDir) return; // Show folders only

                        const div = document.createElement('div');
                        div.className = 'file-item';
                        div.innerHTML = `
                            <span class="file-icon">📁</span>
                            <span>${item.name}</span>
                        `;
                        div.onclick = () => loadFileList(item.path);
                        list.appendChild(div);
                    });
                })
                .catch(err => console.error('Load files failed:', err));
        }

        function confirmSelection() {
            document.getElementById('download-path').value = currentBrowserPath;
            closeFileBrowser();
        }
    </script>
</body>

</html>
